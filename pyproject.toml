[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]
ignore = [
    # `import torch.nn as nn` / `import torch.nn.functional as F` are the
    # conventional PyTorch spellings; rewriting them hurts readability.
    "PLR0402",
]

[tool.ruff.lint.per-file-ignores]
# Asserting on literal status codes is the point of an HTTP test.
"tests/*" = ["PLR2004"]
