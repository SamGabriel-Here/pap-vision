name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-train.txt includes requirements.txt and adds scikit-learn,
        # which tests/test_baseline.py needs via baseline.py. Installing only the
        # runtime requirements makes that suite fail at import.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
